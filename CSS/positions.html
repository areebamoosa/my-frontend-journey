<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position</title>
    <style>
      .container {
        border: 4px solid rgb(12, 212, 238);
        background-color: rgb(245, 215, 179);
        height: 5500px;
      }
      .box {
        display: inline-block;
        border: 2px solid rgba(163, 9, 9, 0.903);
        width: 150px;
        height: 180px;
        margin: 3px;
      }

      /* CSS Positions : Static(Default), Absolute, Relative, Fixed, Sticky */

      /* By default, every HTML element in CSS has static position:
      This is the default position that the browser gives to every element unless you change it using CSS.

      Position: static means?
      The element stays in the normal document flow (top to bottom, left to right).
      It cannot be moved using top, left, right, or bottom values.
      It's just placed where it naturally belongs in the layout. */

      #box1 {
        /* relative to its normal position & will leave a gap at its normal position */
        /* Position : Relative */

        position: relative;
        top: 134px;
        left: 30px;
      }

      #box3 {
        /* Position : Absolute */
        /* relative to the position of its parent */
        /* ye apni original position ki jaga nhi chodta like no space */
        position: absolute;
        top: 34px;
        left: 140px;
      }

      #box4 {
        /* Position : Fixed */
        /* The container will be fixed at the side no matter how much you scroll */

        position: fixed;
        right: 4px;
      }

      #box2 {
        /* Position : Sticky */
        position: sticky;
        top: 3px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box" id="box1">1</div>
      <div class="box" id="box2">2</div>
      <div class="box" id="box3">3</div>
      <div class="box" id="box4">4</div>
    </div>
  </body>
</html>
