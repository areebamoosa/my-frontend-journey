<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLEXBOX</title>
    <style>
      .container {
        height: 1554px;
        width: 100%px;
        border: 4px solid rgb(23, 21, 21);
        /* Initialize the container as a flexbox */
        display: flex;

        /* Flex properties*/

        /* Flex-direction:
        It decides which way the items will be placed inside a flex container. */

        flex-direction: column;

        /* By default, the property of flex is nowrap : the containers have to fit in one line no matter what */
        flex-wrap: wrap;
        /* Flex wrap : wrap is if the containers are not fitting in one line, then they can be fitted in the next line.  */

        /* flexflow is shortcut for both flex direction + flex wrap */
        /* flex-flow: row-reverse wrap; */

        /* Space between means to give space to boxes in between and not on corners ( This puts one element at the start and one element at the bottom ) */
        /* justify-content: space-between; */

        /* Space evenly means to have space between all the boxes evenly */
        /* justify-content: space-evenly; */

        /* Space around means each box will have space on both left & right side */
        /* justify-content: space-around; */

        /* all items will be aligned on center */
        /* align-items: center; */

        /* items are by default flex start at the start before center alignment*/
        /* align-items: flex-start; */

        /* items will be aligned on the end of the container */
        /* align-items: flex-end; */

        /* align-items: stretch; */
        /* stretch makes evenly space between boxes no matter how much you make its height/width long or short */

        flex-direction: column;
      }
      .item {
        width: 200px;
        height: 200px;
        border: 4px solid rgb(19, 18, 18);
        margin: 10px;
        padding: 20px;
      }

      /* flex properties for flex item */
      #item1 {
        background-color: red;
        /* Bary orders waly boxes bad mn, choty orders waly boxes pehly dekhaingy */
        /* higher the order, later it shows up in the container*/
        order: 2;

        /* flex grow refers to taking space */
        flex-grow: 2;

        /* flex-shrink: 3; */

        /* when flex direction is set to row flex-basis: will conrtol width  */
        /* when flex direction is set to column flex-basis: will conrtol height  */
        /* flex-basis: 320px; */
        /* The width of red item will be greater as compared to other items. */

        /* flex-grow — “Can I grow?”

        It controls how much an item should grow when there's extra space in the flex container.

        flex-grow: 1;
        Example:
        If you have 3 boxes and each has flex-grow: 1, they will share extra space equally.

        If one box has flex-grow: 2, and others have 1, then:

        1st gets 2 parts of space
        2nd & 3rd get 1 part each


       flex-shrink — “Can I shrink?”

       It controls how much an item should shrink when there’s not enough space.

       flex-shrink: 1;
 
 
       flex-shrink: 0;
       It won’t shrink — it'll stay the same size even if it overflows.
 
       flex-basis — “What’s my starting size?”

       It sets the initial size of the item before grow or shrink happens.

       flex-basis: 200px;
       Means: “Start at 200px, then grow or shrink based on space and rules.” */
      }
      #item2 {
        background-color: pink;
        flex-shrink: 3;
      }
      #item3 {
        background-color: blue;
        flex-grow: 3;

        /* shortcut */
        /* flex = flexgrow + flexshrink + flexbasis */
        /* flex: 2 2 334px; */

        align-self: flex-end;
        align-self: flex-start;
        align-self: center;
      }
    </style>
  </head>
  <body>
    <h1>FLEXBOX</h1>
    <div class="container">
      <div class="item" id="item1">First Box</div>
      <div class="item" id="item2">Second Box</div>
      <div class="item" id="item3">Third Box</div>

      <!-- Flexbox Notes -->

      <!-- 

Flexbox:
Imagine you have a box (called a container) and you want to arrange small boxes (called items) inside it nicely in a row or column.
Flexbox helps you align, space, and order these items easily!

How to Use Flexbox

To use Flexbox, you write this on the parent box (container):
display: flex;
Now this container becomes a flex container, and the elements inside it are called flex items.

Flexbox has 2 parts:

1. Properties for the Container (Parent)

These control how the children behave.


| Property          | Simple Meaning                                          |
| ----------------- | ------------------------------------------------------- |
| `flex-direction`  | Should the items go in a row or a column?               |
| `justify-content` | How to space items **horizontally** (left to right)?    |
| `align-items`     | How to align items **vertically** (top to bottom)?      |
| `align-content`   | Used when you have multiple rows, to space them up/down |
| `flex-wrap`       | Should items go to the next line if there’s no space?   |
| `gap`             | Adds space between the items                            |

2. Properties for the Items (Children)
These control how each item behaves in the container.

| Property      | Simple Meaning                                       |
| ------------- | ---------------------------------------------------- |
| `flex-grow`   | Should this item grow to take more space?            |
| `flex-shrink` | Can this item shrink if space is small?              |
| `flex-basis`  | What should be the starting size of this item?       |
| `flex`        | A shortcut to write grow, shrink, and basis together |
| `align-self`  | Align one single item differently than others        |
| `order`       | Change the position of items                         |

Container Properties:

1.flex-direction
Tells the direction of the items (like a line of kids in a row or column)

flex-direction: row;                   /* (default) left to right */
flex-direction: column;               /* top to bottom */
flex-direction: row-reverse;         /* right to left */
flex-direction: column-reverse;     /* bottom to top */


2.justify-content
Controls space between items horizontally

justify-content: flex-start;    /* all go to the left */
justify-content: center;        /* all go to the center */
justify-content: flex-end;      /* all go to the right */
justify-content: space-between; /* space between items */
justify-content: space-around;  /* space on left and right of each */
justify-content: space-evenly;  /* equal space everywhere */


3.align-items
Aligns items vertically (if flex-direction: row)

align-items: stretch;     /* (default) stretch to fill height */
align-items: flex-start;  /* top */
align-items: center;      /* middle */
align-items: flex-end;    /* bottom */

4.flex-wrap
Should items wrap to a new line?

flex-wrap:    nowrap	(Default)  Don’t wrap — squish items into one line
flex-wrap:    wrap	 Wrap items to the next line if needed
flex-wrap:    wrap-reverse Wrap items to the next line in reverse order

5.align-content
Aligns multiple rows (when wrapped)

align-content: flex-start;
align-content: center;
align-content: flex-end;
align-content: space-between;
align-content: space-around;
align-content: stretch;

Item Properties :

1.flex-grow
How much should this item grow?

flex-grow: 0;  /* don’t grow (default) */
flex-grow: 1;  /* grow to fill space */

2.flex-shrink
Should this item shrink when there's less space?

flex-shrink: 1;  /* shrink if needed (default) */
flex-shrink: 0;  /* don’t shrink */

3.flex-basis
Starting size of the item (before growing/shrinking)

flex-basis: 100px; /* give 100px to start with */

4.flex
Shortcut for grow, shrink, and basis

flex: 1 1 100px; /* grow:1, shrink:1, basis:100px */

You can also write simply:

flex: 1; /* same as grow:1, shrink:1, basis:0 */

5.align-self
Make one item align differently than others.

align-self: flex-start;
align-self: center;
align-self: flex-end;
align-self: stretch;

6.order
Change order of the items!

order: 1; /* goes after order 0 (default) */
order: -1; /* goes before others */

What is flex-basis (In detail) :
flex-basis sets the starting size of a flex item before it grows or shrinks (based on available space).

Think of it like:
“Hey item, how big do you want to be before we decide to stretch or shrink you?”

<div class="container">
  <div class="box one">Box 1</div>
  <div class="box two">Box 2</div>
  <div class="box three">Box 3</div>
</div>

//style
  .container {
  display: flex;
  width: 600px;
  border: 2px solid black;
}

.box {
  flex-grow: 1;
  flex-shrink: 1;
  flex-basis: 100px;
  text-align: center;
  padding: 20px;
  color: white;
}

.one { background-color: tomato; }
.two { background-color: royalblue; }
.three { background-color: mediumseagreen; }

What’s happening here :
flex-basis: 100px; → Each box wants to start at 100px width.

flex-grow: 1;  Each box can grow equally if space is left.

The container is 600px wide. So:

Box 1: starts at 100px
Box 2: starts at 100px
Box 3: starts at 100px
→ Total 300px taken

Space left = 600 - 300 = 300px
→ All 3 grow equally using flex-grow
→ Each grows 100px more
→ Final size = 200px each

So flex-basis is the starting size, not final size.

Now, Lets Change the flex-basis!

.one { flex-basis: 100px; }
.two { flex-basis: 200px; }
.three { flex-basis: 300px; }

Now initial sizes = 100 + 200 + 300 = 600px → Exactly fits!

So final size = same as flex-basis (no growing happens because there's no extra space)

KEY IDEA:
flex-basis is the starting size (like “ideal size”)
flex-grow and flex-shrink decide what happens after that based on available space

  
      -->
    </div>
  </body>
