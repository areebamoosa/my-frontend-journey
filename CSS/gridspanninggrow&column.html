<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Spanning Rows & Columns</title>
    <style>
      .container {
        display: grid;

        /* Create 5 equal columns using 1fr each */
        grid-template-columns: repeat(5, 1fr);

        /* Create 4 equal rows using 1fr each */
        /* grid-template-rows: repeat(4, 1fr); */

        grid-column-gap: 4rem;
        grid-row-gap: 3rem;
      }

      .item {
        background-color: pink;
        border-left: 2px solid rgb(253, 124, 146);
        color: white;
        padding: 10px 3px;
      }

      /* .item:first-child { */
      /* Make the first item span across multiple columns and rows */

      /* Start at column 1 and span 3 columns (1 to 4) */
      /* grid-column: 1 / span 3; */

      /* Start at row 1 and span 3 rows (1 to 4) */
      /* grid-row: 1 / span 3; */
      /* } */
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">Item 01</div>
      <div class="item">Item 02</div>
      <div class="item">Item 03</div>
      <div class="item">Item 04</div>
      <div class="item">Item 05</div>
      <div class="item">Item 06</div>
      <div class="item">Item 07</div>
      <div class="item">Item 08</div>
    </div>
  </body>
</html>
