<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More CSS Selectors</title>
    <style>
      h1 {
        background-color: pink;
        color: black;
        font-weight: bold;
        text-align: center;
        width: 1000px;
        border: 4px solid rgb(216, 112, 130);
      }

     /*
    div p {
      color: yellow;
      background-color: green;
    }
    This means, All <p> tags inside any <div> will be yellow text on green background
    */

      /*
    div li p {
      color: red;
      background-color: blue;
    }
    This means, <p> inside <li> which is inside <div> will have red text and blue background
    */

      /*
    div > p {
      color: red;
      background-color: blue;
    }
    This means, Only <p> tags that are directly inside a <div> (not nested deeper) will be affected
    */

      div + p {
        color: red;
        background-color: blue;
      }
      /* This means, if a <p> tag comes immediately after a <div> (as a next sibling), it will have red text and blue background */
    </style>
  </head>
  <body>
    <h1>More Selectors</h1>

    <div class="container">
      <p>This is a paragraph</p>
      <!-- This is a p inside div (direct child) -->

      <div>
        <ul>
          <li><p>This will also get affected</p></li>
          <!-- Nested, inside li inside div -->
          <p>This will not get affected</p>
          <!-- Inside div but not direct child -->
          <li>This is a li inside ul</li>
        </ul>
      </div>

      <p>This is also sibling of div</p>
      <!-- This comes after the inner div, so not directly after -->
    </div>

    <p>This para is sibling of div</p>
    <!-- This <p> comes right after the main div.container so it will be affected by div + p -->
  </body>
</html>
