<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Row & Gaps</title>
    <style>
      .grid {
        display: grid; /* This makes the container use CSS Grid layout */

        grid-template-rows: 1fr 1fr 4fr 5fr;
        /* This sets the first 4 row sizes.
           1fr means 1 part of space, so the 3rd row will be 4 times taller,
           and the 4th row will be 5 times taller than the first row. */

        grid-auto-rows: 2fr;
        /* Any extra rows that are not defined above
           will automatically be 2 times the size of a single fraction (2fr). */

        /* grid-template-columns: 1fr 4fr 2fr; */
        /* This will create 3 columns with different widths: 1 part, 4 parts, and 2 parts. */

        grid-gap: 0.5rem; /* Adds space (gap) between grid items */

        /* grid-template-columns: repeat(9, 2fr); */
        /* This creates 9 columns. Each column gets 2 equal parts of space (2fr).
           "repeat(9, 2fr)" is a shortcut for writing "2fr" 9 times. */
      }

      .box {
        background-color: rgb(252, 182, 194);
        border: 3px solid rgb(246, 102, 126);
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <!-- These are 10 boxes created using a loop-like format:
           div.box{This is a box-$}*10 means 10 divs with numbers 1–10 -->
      <div class="box">This is a box-1</div>
      <div class="box">This is a box-2</div>
      <div class="box">This is a box-3</div>
      <div class="box">This is a box-4</div>
      <div class="box">This is a box-5</div>
      <div class="box">This is a box-6</div>
      <div class="box">This is a box-7</div>
      <div class="box">This is a box-8</div>
      <div class="box">This is a box-9</div>
      <div class="box">This is a box-10</div>
    </div>
  </body>
</html>
