<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Autofit & MinMax</title>
    <style>
      .container {
        display: grid;
        grid-gap: 3rem;

        /* These are other examples, not used now: */
        /* grid-template-columns: 112px 112px 112px;  => 3 fixed columns */
        /* grid-template-columns: 1fr 1fr 1fr; => 3 equal flexible columns */

        align-items: center;

        /* This line creates as many columns as can fit in the row.
         Each column will be at least 30px wide and at most 40px wide.
         The layout automatically adjusts depending on screen size. */
        grid-template-columns: repeat(auto-fit, minmax(30px, 40px));
      }

      .box {
        border: 2px solid black;
        background-color: pink;
        padding: 34px;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Item 1</div>
      <div class="box">Item 2</div>
      <div class="box">Item 3</div>
      <div class="box">Item 4</div>
      <div class="box">Item 5</div>
      <div class="box">Item 6</div>
      <div class="box">Item 7</div>
      <div class="box">Item 8</div>
      <div class="box">Item 9</div>
      <div class="box">Item 10</div>
      <div class="box">Item 11</div>
      <div class="box">Item 12</div>
    </div>
  </body>
</html>
