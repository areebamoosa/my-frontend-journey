<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grids</title>
    <style>
              .container{
                  border: 2px solid black;
                  display: grid;
                  grid-template-columns: 120px 100px;

                  /* You can also name the grids */
                  grid-template-columns: [first] 120px [end] 100px;
                  /* This is another way of writing the same thing, but it names the grid lines: */
                  /* Line before 120px is called first */
                  /* Line after 120px and before 100px is called end */
              }
              .items{
                  border: 2px solid red;
                  height: 55px;
                  width: 55px;
              }
              .item-4{
                  grid-row: 1/2;

                  /* You can also write this as */
                  /* grid-row-start: 1; */
                  /* grid-row-end: 2; */

                  grid-column: 1/2;
                  /*Places this item in column 1, ending before column 2. */
                  grid-row: 1/2 ;
                  /* Places this item in row 1, ending before row 2. */
                  /* So this item goes to the top-left cell of the grid. */
              }
              .item-5{
                  grid-row: 1/2;
                  grid-column: 1/2;
              }
              /* Items by default fill the grid in order from left to right, top to bottom.
              But .item-4 and .item-1 are both forced into the same grid cell (row 1, column 1).
              So these two items overlap.*/
    </style>
  </head>
  <body>
    <div class="container">
      <div class="items">1</div>
      <div class="items">2</div>
      <div class="items">3</div>
      <div class="items item-4">4</div>
      <div class="items item-5">5</div>
    </div>
  </body>
</html>
