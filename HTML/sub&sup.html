<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tags</title>
  </head>
  <body>
    <!-- big tag text ko bara kr deta hai -->
    <big>This tag shows big text</big>

    <!-- small tag text ko chota kr deta hai -->
    <small>This tag shows small text</small>

    <!-- hr tag aik horizontal line lagata hai page mein -->
    <!-- Hr tag is used to separate content and add a line  -->
    <hr />

    <br /><br />
    <!-- br is for line break -->

    <!-- sub and sup tags -->

    <!-- subscript tag niche likhne k liye use hoti hai (mostly chemistry waghaira mein) -->
    <!-- sup tag upar likhne k liye use hoti hai (mostly maths exponents etc.) -->

    <p>H<sub>2</sub>O</p>
    <!-- H2O ka 2 neeche aayega -->
    <p>3<sup>2</sup> = 9</p>
    <!-- 3 raised to the power 2 -->

    <!-- Super and Sub Script -->

    <p>
      This is an <sup>example of superscript text</sup> and this is
      <sub>an example of subscript text</sub>
    </p>
  </body>
</html>
