    <!-- Extras  -->

    <div class="container">
      <div class="box" data-createdby="Areeba"></div>
    </div>
    <!-- Class List -->
    <div class="box red green">I am red</div>

    <!-- Events -->

    <button id="btn">Click me</button>

    <!-- Event Bubbling -->

    <div class="container">
      <section class="childContainer">
        <div class="child">I am a Child.</div>
      </section>
    </div>

    <script>
      document.querySelector(".child").addEventListener("click", () => {
        alert("Child was clicked!");
      });
      document
        .querySelector(".childContainer")
        .addEventListener("click", () => {
          alert("Child Container was clicked!");
        });
      document.querySelector(".container").addEventListener("click", () => {
        alert("Container was clicked!");
      });

      //over here when we click on child, automatically container and child container will also be clicked.

      // to stop this we do this, after this when we click on child only that event will e invoked and no others.

      document.querySelector(".child").addEventListener("click", (e) => {
        e.stopPropagation();
        alert("Child was clicked!");
      });
      document
        .querySelector(".childContainer")
        .addEventListener("click", (e) => {
          e.stopPropagation();
          alert("Child Container was clicked!");
        });
      document.querySelector(".container").addEventListener("click", (e) => {
        alert("Container was clicked!");
      });

      // Set Interval : setting a time

      setInterval(() => {
        document.querySelector(".childContainer").style.backgroud = "pink";
      }, 3000);
      // whatever we do inside this, it will happen after the time we assigned.

      //
    </script>
